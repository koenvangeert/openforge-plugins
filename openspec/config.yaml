schema: spec-driven

context: |
  pnpm workspace monorepo of OpenForge Trusted Plugins, one package per
  directory under plugins/. TypeScript, Svelte 5, Vitest, Vite.

  Plugins may only use the public @openforge-app/plugin-sdk contract
  (../openforge/docs/plugin-authoring.md). No OpenForge application internals.

  Toolchain versions are pinned in pnpm-workspace.yaml under catalog: and
  referenced per plugin with "catalog:". svelte is an exact pin, not a range.

  Ubiquitous language lives in CONTEXT.md; decisions in docs/adr/.
  Working agreements, including the mandatory test/build/reload cycle for every
  plugin change, live in AGENTS.md.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
